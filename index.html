<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>戦国人生絵巻 - 乱世の輪廻 -</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --wafu-bg: #090807;
            --wafu-panel: #161311;
            --wafu-panel-light: #211C18;
            --wafu-text: #D8D1C7;
            --wafu-gold: #C5A059;
            --wafu-gold-bright: #F5D389;
            --wafu-red: #8B0000;
            --wafu-border: #3A322A;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--wafu-bg);
            color: var(--wafu-text);
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #app-container {
            background-color: var(--wafu-panel);
            background-image: url('data:image/svg+xml;utf8,<svg width="80" height="80" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="80" height="80" filter="url(%23n)" opacity="0.035"/></svg>');
            box-shadow: 0 0 40px rgba(0,0,0,0.95);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .mode-battle {
            border-color: #7A1919 !important;
            background-color: #1F0F0F !important;
        }

        .mode-fugitive {
            border-color: #403E3B !important;
            background-color: #121110 !important;
        }

        .vertical-rl {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.25);
        }
        ::-webkit-scrollbar-thumb {
            background: #473E34;
            border-radius: 2px;
        }

        .text-gold {
            color: var(--wafu-gold);
            text-shadow: 0 0 8px rgba(197,160,89,0.3);
        }

        .text-blood {
            color: #EF4444;
            text-shadow: 0 0 10px rgba(239,68,68,0.45);
        }

        .log-entry {
            border-bottom: 1px dashed rgba(70,60,50,0.4);
            padding-bottom: 0.55rem;
            margin-bottom: 0.55rem;
            color: #A9A297;
            font-size: 0.82rem;
            line-height: 1.55;
            animation: fadeInLog 0.22s ease-out forwards;
        }
        @keyframes fadeInLog {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 状況説明の強調表示カード */
        .event-active-card {
            background: linear-gradient(180deg, rgba(38,32,27,0.95) 0%, rgba(20,17,14,0.98) 100%);
            border: 1px solid var(--wafu-gold);
            box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 0 15px rgba(197,160,89,0.1);
            border-radius: 4px;
            padding: 0.75rem 0.85rem;
            margin: 0.6rem 0 0.8rem 0;
            animation: pulseEventCard 2.5s infinite alternate;
        }
        @keyframes pulseEventCard {
            from { border-color: rgba(197,160,89,0.7); box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 0 10px rgba(197,160,89,0.06); }
            to { border-color: rgba(245,211,137,1); box-shadow: 0 4px 22px rgba(197,160,89,0.3), inset 0 0 18px rgba(197,160,89,0.15); }
        }

        .choice-btn {
            background: linear-gradient(180deg, #26211C 0%, #1A1613 100%);
            border: 1px solid #4D4236;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            touch-action: manipulation;
            transition: all 0.12s ease;
        }
        .choice-btn:hover {
            border-color: var(--wafu-gold);
            background: linear-gradient(180deg, #332B24 0%, #221D19 100%);
        }
        .choice-btn:active {
            transform: scale(0.985);
            background: #4A1919;
            border-color: #8B0000;
        }

        .action-button-main {
            touch-action: manipulation;
            cursor: pointer;
            pointer-events: auto !important;
        }

        .damage-flash {
            animation: redFlash 0.35s ease-out;
        }
        @keyframes redFlash {
            0% { box-shadow: inset 0 0 60px rgba(180,0,0,0.85); }
            100% { box-shadow: 0 0 40px rgba(0,0,0,0.95); }
        }

        /* 大往生フリーズ演出 */
        .freeze-overlay {
            position: absolute;
            inset: 0;
            background-color: black;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
        }
        .freeze-active {
            animation: freezeSequence 3.4s ease-in forwards;
        }
        @keyframes freezeSequence {
            0% { opacity: 0; background: #000; }
            12% { opacity: 1; background: #000; }
            85% { opacity: 1; background: #000; }
            88% { opacity: 1; background: #FFF; }
            100% { opacity: 0; background: #FFF; display: none; }
        }

        .premium-bg {
            background: radial-gradient(circle at center, rgba(160, 120, 40, 0.28) 0%, rgba(8, 7, 6, 0.98) 85%);
            animation: goldRadiance 4s infinite alternate ease-in-out;
        }
        @keyframes goldRadiance {
            from { background: radial-gradient(circle at center, rgba(160, 120, 40, 0.22) 0%, rgba(8, 7, 6, 0.98) 85%); }
            to { background: radial-gradient(circle at center, rgba(215, 165, 55, 0.42) 0%, rgba(12, 10, 8, 0.96) 85%); }
        }

        .text-golden {
            background: linear-gradient(180deg, #FFF9E6 0%, #E5BE53 50%, #946B12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(229,190,83,0.5);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }

        .anim-slide-up {
            opacity: 0;
            transform: translateY(14px);
            animation: slideUp 0.75s ease-out forwards;
        }
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 死因別ゲームオーバー演出 */
        .death-bg-battle { background-color: rgba(20, 0, 0, 0.95); box-shadow: inset 0 0 100px rgba(150,0,0,0.5); }
        .death-bg-starvation { background-color: rgba(15, 15, 10, 0.95); filter: sepia(0.6) grayscale(0.5); }
        .death-bg-execution { background-color: rgba(0, 0, 0, 0.98); }
        .death-bg-hunted { background-color: rgba(10, 20, 15, 0.95); box-shadow: inset 0 0 80px rgba(0,0,0,0.8); }
        .death-bg-oldage { background-color: rgba(20, 20, 20, 0.95); }

        .death-text-battle { color: #EF4444; text-shadow: 0 0 15px rgba(255,0,0,0.6); }
        .death-text-starvation { color: #A09070; text-shadow: 0 0 10px rgba(160,144,112,0.4); }
        .death-text-execution { color: #FFFFFF; text-shadow: 0 0 20px #8B0000; letter-spacing: 0.5em; }
        .death-text-hunted { color: #6B705C; text-shadow: 0 0 10px rgba(107,112,92,0.5); }
        .death-text-oldage { color: #B0B0B0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        #market-panel {
            transition: max-height 0.22s ease-in-out, opacity 0.22s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        #market-panel.market-open {
            max-height: 180px;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="app-container" class="w-full h-full sm:h-[95vh] sm:max-h-[850px] max-w-md mx-auto relative flex flex-col sm:border sm:border-[#3A322A] sm:rounded-lg overflow-hidden">

        <!-- ================= 1. タイトル＆スタート画面 ================= -->
        <div id="start-screen" class="absolute inset-0 z-30 bg-[#161311] flex flex-col items-center justify-between px-6 py-8">
            <div class="flex-grow flex items-center justify-center relative w-full">
                <div class="absolute inset-0 flex items-center justify-center opacity-10 text-[10rem] font-black text-red-700 pointer-events-none select-none">輪</div>
                <h1 class="vertical-rl text-5xl sm:text-6xl font-black text-white tracking-[0.35em] drop-shadow-[0_0_20px_rgba(200,0,0,0.6)] z-10">乱世の輪廻</h1>
            </div>

            <div class="w-full text-center my-3">
                <div class="border-y border-[#3A322A] py-3 bg-black/45 rounded-sm">
                    <span class="text-gray-400 text-xs font-bold block mb-1">輪廻の巡り</span>
                    <div class="text-3xl font-black text-white"><span id="ui-reincarnations">0</span><span class="text-sm text-gray-400 font-normal ml-1">回</span></div>
                </div>

                <div id="heirloom-display" class="hidden bg-[#211C18] border border-gold/40 p-3 rounded-sm text-left shadow-lg mt-3">
                    <span class="text-[11px] text-gold font-bold block mb-0.5">【継承家宝】</span>
                    <strong id="hl-name" class="text-white text-sm block">--</strong>
                    <span id="hl-desc" class="text-gray-400 text-xs mt-0.5 block">--</span>
                </div>
            </div>

            <div class="w-full space-y-3 z-10">
                <button id="start-btn" type="button" class="action-button-main w-full bg-[#6B1717] hover:bg-[#8B0000] text-white border border-[#A32020] py-4 text-xl font-bold active:scale-95 transition-all shadow-[0_0_20px_rgba(139,0,0,0.5)] tracking-[0.25em] rounded-sm">
                    乱世に堕ちる
                </button>
                <button id="history-btn" type="button" class="action-button-main w-full bg-black/50 text-gray-400 hover:text-white border border-[#3A322A] py-2.5 text-xs font-bold tracking-widest rounded-sm transition-all">
                    輪廻の回想
                </button>
            </div>
        </div>

        <!-- ================= 2. メインゲーム画面 (3段構造) ================= -->
        <div id="game-screen" class="hidden h-full w-full flex flex-col relative z-10 overflow-hidden">
            
            <!-- 上段: 固定ステータスヘッダー ＆ 米市場 -->
            <header class="shrink-0 bg-[#14110F] border-b border-[#3A322A] p-3 z-20 shadow-md">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <div class="flex items-center gap-1.5 mb-1">
                            <span id="ui-faction" class="text-[10px] font-bold px-2 py-0.5 rounded-sm border border-white/20 text-white bg-[#333]">--</span>
                            <span id="ui-mode-badge" class="text-[10px] bg-red-950 text-red-200 border border-red-600 px-1.5 py-0.5 font-bold rounded-sm hidden">戦場</span>
                        </div>
                        <h2 id="ui-class" class="text-2xl font-black text-white tracking-wider">--</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-gray-400 font-bold block">享年まで</span>
                        <div class="text-2xl font-black text-white"><span id="ui-age">15</span><span class="text-xs text-gray-400 font-normal ml-0.5">歳</span></div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div id="health-box" class="bg-[#201C18] p-1.5 text-center border border-[#3A322A] rounded-sm transition-colors">
                        <span class="block text-[10px] text-gray-400 font-bold">体力</span>
                        <span id="ui-health" class="text-lg font-black text-white">100</span>
                    </div>
                    <div class="bg-[#201C18] p-1.5 text-center border border-[#3A322A] rounded-sm">
                        <span class="block text-[10px] text-gray-400 font-bold">所持金</span>
                        <span id="ui-money" class="text-lg font-bold text-gold">0</span><span class="text-[9px] text-gray-400 ml-0.5">文</span>
                    </div>
                    <div class="bg-[#1C1710] border border-yellow-900/40 rounded-sm flex flex-col justify-between">
                        <div class="p-1 text-center">
                            <span class="block text-[10px] text-gray-400 font-bold">米蔵</span>
                            <span id="ui-rice" class="text-lg font-bold text-yellow-100">0</span><span class="text-[9px] text-gray-400 ml-0.5">石</span>
                        </div>
                        <button id="market-toggle-btn" type="button" class="w-full bg-yellow-950/40 text-yellow-400 hover:bg-yellow-900 hover:text-white text-[9px] py-0.5 font-bold border-t border-yellow-900/50 cursor-pointer">
                            米市場 ▼
                        </button>
                    </div>
                </div>

                <!-- 米市場アコーディオンパネル -->
                <div id="market-panel">
                    <div class="pt-2 pb-1 border-t border-[#3A322A] mt-2">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-xs text-gray-400">相場 (米一石)</span>
                            <div class="text-base font-black text-gold"><span id="ui-rice-price">30</span><span class="text-xs font-normal text-gray-400 ml-1">文</span></div>
                        </div>
                        <div class="flex gap-2">
                            <button id="buy-rice-btn" type="button" class="flex-1 bg-[#231E19] border border-[#3A322A] text-white hover:border-gold py-1 text-xs font-bold rounded-sm active:scale-95 cursor-pointer">買入</button>
                            <button id="sell-rice-btn" type="button" class="flex-1 bg-[#231E19] border border-[#3A322A] text-white hover:border-gold py-1 text-xs font-bold rounded-sm active:scale-95 cursor-pointer">売却</button>
                        </div>
                        <div id="market-msg" class="text-[10px] text-center mt-1 h-3 text-red-400 transition-opacity opacity-0"></div>
                    </div>
                </div>
            </header>

            <!-- 中段: メインスクロール可能ログエリア (flex-1) -->
            <main id="log-container" class="flex-1 overflow-y-auto px-4 py-3 flex flex-col relative scroll-smooth overscroll-contain">
                <!-- 過去の人生ログやイベントカードがここに積まれる -->
            </main>

            <!-- 下段: 固定アクションエリア (選択肢 or 進むボタン) -->
            <footer id="action-bar" class="shrink-0 bg-[#161311] border-t border-[#3A322A] p-3 shadow-[0_-8px_20px_rgba(0,0,0,0.85)] z-20">
                <!-- 選択肢群 (最大高さ制限 & 内部スクロール) -->
                <div id="choices-container" class="hidden flex-col gap-2 w-full max-h-[190px] overflow-y-auto pr-0.5"></div>
                
                <!-- 通常進行ボタン -->
                <div id="advance-container" class="w-full">
                    <button id="advance-btn" type="button" class="action-button-main w-full bg-[#6B1717] hover:bg-[#8B0000] text-white py-3.5 px-4 text-base font-bold border border-[#8B0000] rounded-sm active:scale-98 transition-all tracking-widest shadow-md flex items-center justify-center">
                        <span id="advance-btn-text">歳 月 を 進 め る</span>
                    </button>
                </div>
            </footer>
        </div>

        <!-- ================= 3. 通常死亡画面 (討死) ================= -->
        <div id="gameover-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-5 text-white text-center backdrop-blur-md overflow-y-auto pointer-events-auto transition-colors duration-700">
            <h2 id="go-main-title" class="text-5xl sm:text-6xl font-black mb-1 mt-2 tracking-[0.25em]">討死</h2>
            <p id="go-sub-title" class="text-[10px] text-gray-500 mb-3 tracking-widest">- 乱世の泡と消ゆ -</p>

            <div class="mb-3 w-full max-w-sm text-left border border-gray-800 p-4 bg-[#0D0B0A] shadow-2xl relative rounded-sm">
                <div class="flex justify-between items-end border-b border-gray-800 pb-2">
                    <span class="text-xs text-gray-400">享年</span>
                    <span class="text-3xl font-black text-white"><span id="go-age">--</span><span class="text-sm font-normal text-gray-400 ml-1">歳</span></span>
                </div>
                <div class="flex justify-between items-end mt-2 mb-1">
                    <span class="text-xs text-gray-400">身分</span>
                    <span class="text-base font-bold text-white"><span id="go-faction" class="text-xs text-gray-400 mr-1.5"></span><span id="go-class">--</span></span>
                </div>
                <div class="flex justify-between items-end mb-3">
                    <span class="text-xs text-gray-400">二つ名</span>
                    <span class="text-sm font-black text-gold" id="go-title">--</span>
                </div>

                <div class="bg-black/70 p-2.5 border border-gray-800 rounded-sm">
                    <div class="grid grid-cols-3 gap-y-2 text-xs text-gray-400 text-center">
                        <div>武功: <span id="go-valor" class="font-bold text-white">0</span></div>
                        <div>悪逆: <span id="go-karma" class="font-bold text-white">0</span></div>
                        <div>運: <span id="go-luck" class="font-bold text-white">0</span></div>
                        <div>知略: <span id="go-strategy" class="font-bold text-white">0</span></div>
                        <div>人徳: <span id="go-virtue" class="font-bold text-white">0</span></div>
                        <div>銭: <span id="go-money" class="font-bold text-gold">0</span></div>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-sm mb-3">
                <p id="go-reason" class="text-xs leading-relaxed text-gray-300 text-left border-l-2 border-red-900 pl-2.5 py-1"></p>
            </div>

            <div id="new-heirloom-notice" class="hidden mb-3 w-full max-w-sm border border-gold/60 bg-yellow-950/20 p-2 text-center rounded-sm">
                <span class="text-[11px] text-gold font-bold block mb-0.5">【次世への家宝】を感得！</span>
                <span id="new-heirloom-text" class="text-white text-xs font-bold"></span>
            </div>

            <button id="rinne-btn" type="button" class="action-button-main w-full max-w-sm border-2 border-red-700 bg-red-950/80 hover:bg-red-900 text-white py-3.5 text-base font-bold tracking-widest rounded-sm transition-all active:scale-95 shadow-[0_0_15px_rgba(139,0,0,0.6)] z-50">
                次なる輪廻へ
            </button>
        </div>

        <!-- ================= 4. 60歳以上 大往生プレミアム画面 ================= -->
        <div id="premium-screen" class="hidden absolute inset-0 z-50 premium-bg flex flex-col items-center justify-center text-center overflow-hidden pointer-events-auto">
            <canvas id="particle-canvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>
            <div id="freeze-overlay" class="freeze-overlay"></div>

            <div id="premium-content" class="z-20 w-full px-6 opacity-0 flex flex-col items-center pointer-events-auto">
                <p class="text-sm sm:text-base text-yellow-200 mb-2 font-bold tracking-[0.3em] anim-slide-up" style="animation-delay: 2.0s;">人生六十年、化天のうちを比ぶれば</p>
                <h2 class="text-5xl sm:text-6xl font-black text-golden mb-4 tracking-widest anim-slide-up" style="animation-delay: 2.6s;">大往生</h2>

                <div class="w-full max-w-sm border-y border-gold/70 py-4 mb-4 bg-black/80 anim-slide-up backdrop-blur-md" style="animation-delay: 3.2s;">
                    <p class="text-gold text-xs mb-1 font-bold tracking-widest" id="premium-title">【称号】</p>
                    <p class="text-gray-400 text-[10px] mb-3">六十年の過酷なる乱世を完遂せし英傑</p>

                    <div class="flex justify-between items-end px-4 border-b border-gray-800 pb-2 mb-2">
                        <div class="text-left">
                            <span class="block text-[10px] text-gold">最終身分</span>
                            <span class="text-base font-bold text-white"><span id="premium-faction" class="text-xs text-gray-400 mr-1"></span><span id="premium-class">--</span></span>
                        </div>
                        <div class="text-right">
                            <span class="block text-[10px] text-gold">享年</span>
                            <span class="text-4xl font-black text-white"><span id="premium-age">--</span></span> <span class="text-xs text-gray-400">歳</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-6 gap-1 text-center text-gray-400 px-2 text-[10px]">
                        <div>武功<br><span id="premium-valor" class="text-white font-bold">0</span></div>
                        <div>悪逆<br><span id="premium-karma" class="text-white font-bold">0</span></div>
                        <div>知略<br><span id="premium-strategy" class="text-white font-bold">0</span></div>
                        <div>人徳<br><span id="premium-virtue" class="text-white font-bold">0</span></div>
                        <div>運<br><span id="premium-luck" class="text-white font-bold">0</span></div>
                        <div>銭<br><span id="premium-money" class="text-gold font-bold">0</span></div>
                    </div>
                </div>

                <div id="premium-heirloom-notice" class="hidden anim-slide-up mb-4 border border-gold bg-yellow-950/40 px-5 py-2 rounded-sm" style="animation-delay: 3.6s;">
                    <span class="text-xs text-gold font-bold block">名家宝を授与: <span id="premium-heirloom-text" class="text-white"></span></span>
                </div>

                <button id="premium-rinne-btn" type="button" class="action-button-main w-full max-w-sm anim-slide-up border-2 border-gold bg-black text-gold hover:bg-gold hover:text-black py-3.5 text-base font-bold tracking-widest rounded-sm shadow-[0_0_20px_rgba(197,160,89,0.5)] active:scale-95 transition-all z-30" style="animation-delay: 4.0s;">
                    新時代へ輪廻する
                </button>
            </div>
        </div>

        <!-- ================= 5. 輪廻の回想モーダル ================= -->
        <div id="history-screen" class="hidden absolute inset-0 z-50 bg-[#0C0A09] flex flex-col pointer-events-auto">
            <div class="p-3 border-b border-[#3A322A] bg-[#14110F] flex justify-between items-center shrink-0">
                <h2 class="text-base font-bold text-white tracking-widest">輪廻の回想</h2>
                <button id="close-history-btn" type="button" class="action-button-main text-gray-400 hover:text-white text-3xl px-2 leading-none">&times;</button>
            </div>
            <div id="history-loading" class="flex-grow flex items-center justify-center text-gray-500 text-xs tracking-widest">記録を紐解いています...</div>

        function calculateTitle(s) {
            if (s.classInfo && s.classInfo.id === 'daimyo') return "天下の覇者";
            if (s.classInfo && s.classInfo.id === 'bandit') return "山河の凶魁";
            if (s.strategy >= 70 && s.virtue >= 40) return "王佐の賢将";
            if (s.strategy >= 70) return "稀代の知謀";
            if (s.virtue >= 70) return "徳高き聖将";
            if (s.valor >= 80 && s.karma >= 60) return "第六天魔王";
            if (s.valor >= 70) return "無双の剛槍";
            if (s.karma >= 70) return "乱世の梟雄";
            if (s.money >= 800) return "富国豪商";
            if (s.age >= 60) return "不撓不屈の大往生";
            return "名もなき草奔";
        }

        function determineHeirloom(s) {
            if (s.strategy >= 50) return { name: "孫子の古伝書", type: "strategy", value: 30, desc: "初期知略 +30" };
            if (s.virtue >= 50) return { name: "名馬・松風", type: "virtue", value: 30, desc: "初期人徳 +30" };
            if (s.money >= 1000) return { name: "黄金の茶器", type: "money", value: 400, desc: "初期所持金 +400文" };
            if (s.valor >= 80) return { name: "名刀・備前長船", type: "valor", value: 35, desc: "初期武功 +35" };
            if (s.karma >= 80) return { name: "妖刀・千子村正", type: "karma", value: 35, desc: "初期悪逆 +35" };
            if (s.age >= 60) return { name: "南蛮不老薬", type: "health", value: 40, desc: "初期最大HPが大幅に増加" };
            return null;
        }

        window.updateStartScreenUI = function() {
            const rinneElem = document.getElementById('ui-reincarnations');
            if (rinneElem) rinneElem.innerText = window.currentReincarnationCount || 0;

            const hlBox = document.getElementById('heirloom-display');
            if (hlBox) {
                if (window.activeHeirloom) {
                    hlBox.classList.remove('hidden');
                    document.getElementById('hl-name').innerText = window.activeHeirloom.name;
                    document.getElementById('hl-desc').innerText = window.activeHeirloom.desc;
                } else {
                    hlBox.classList.add('hidden');
                }
            }
        };

        function resetAllStateAndUI() {
            stopAutoPlay();
            isWaitingForChoice = false;
            isProcessing = false;
            state.isAlive = false;

            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }

            const freeze = document.getElementById('freeze-overlay');
            if (freeze) freeze.classList.remove('freeze-active');

            if (gameoverScreen) gameoverScreen.classList.add('hidden');
            if (premiumScreen) premiumScreen.classList.add('hidden');
            if (gameScreen) gameScreen.classList.add('hidden');
            if (historyScreen) historyScreen.classList.add('hidden');

            if (logContainer) logContainer.innerHTML = '';
            if (choicesContainer) {
                choicesContainer.innerHTML = '';
                choicesContainer.classList.add('hidden');
                choicesContainer.classList.remove('flex');
            }
            if (advanceBtn) {
                advanceBtn.classList.remove('hidden');
                if (advanceBtnText) advanceBtnText.innerText = "歳 月 を 進 め る";
            }
            if (appContainer) {
                appContainer.classList.remove('mode-battle', 'mode-fugitive', 'damage-flash');
            }
            if (modeBadge) modeBadge.classList.add('hidden');
            isMarketOpen = false;
            if (marketPanel) {
                marketPanel.classList.remove('market-open');
                marketToggleBtn.innerText = "米市場 ▼";
            }
        }

        window.startGame = function() {
            resetAllStateAndUI();

            const baseClasses = CLASSES.filter(c => c.weight > 0);
            const totalWeight = baseClasses.reduce((sum, c) => sum + c.weight, 0);
            let rW = Math.random() * totalWeight;
            let selectedClass = baseClasses[0];
            for (let c of baseClasses) {
                rW -= c.weight;
                if (rW <= 0) { selectedClass = c; break; }
            }

            const selectedFaction = FACTIONS[Math.floor(Math.random() * FACTIONS.length)];

            state = {
                age: 15, health: selectedClass.initHealth, money: selectedClass.initMoney, rice: 0, ricePrice: 30,
                classInfo: selectedClass, faction: selectedFaction,
                isAlive: true, lastDamageEvent: '', deathCause: '',
                valor: 0, karma: 0, luck: 0, strategy: 0, virtue: 0,
                mode: 'normal', flags: {}
            };

            if (window.activeHeirloom) {
                const hl = window.activeHeirloom;
                if (hl.type === 'money') state.money += hl.value;
                if (hl.type === 'valor') state.valor += hl.value;
                if (hl.type === 'luck') state.luck += hl.value;
                if (hl.type === 'karma') state.karma += hl.value;
                if (hl.type === 'strategy') state.strategy += hl.value;
                if (hl.type === 'virtue') state.virtue += hl.value;
                if (hl.type === 'health') state.health += hl.value;
            }

            if (startScreen) startScreen.classList.add('hidden');
            if (gameScreen) gameScreen.classList.remove('hidden');

            updateRiceMarket();
            updateUI();

            addLog(`<span class="font-bold text-gold">【生誕】</span>${state.faction.name}の領内にて。<br>${state.classInfo.intro}`);
            if (window.activeHeirloom) {
                addLog(`<span class="text-gold font-bold">家宝「${window.activeHeirloom.name}」の加護を受け、宿命の旅が始まる。</span>`);
            }

            scheduleNextAutoPlay(1100);
        };

        function scheduleNextAutoPlay(delay = 900) {
            stopAutoPlay();
            if (!state.isAlive || isWaitingForChoice) return;
            autoPlayTimer = setTimeout(() => {
                if (state.isAlive && !isWaitingForChoice && !isProcessing) {
                    advanceOneYear();
                }
            }, delay);
        }

        window.manualAdvance = function() {
            if (!state.isAlive || isWaitingForChoice || isProcessing) return;
            stopAutoPlay();
            advanceOneYear();
        };

        function advanceOneYear() {
            if (!state.isAlive || isWaitingForChoice || isProcessing) return;
            isProcessing = true;

            state.age++;
            updateRiceMarket();

            const isMilestone = (state.age % 5 === 0);
            const isRandomEvent = Math.random() < 0.25;

            if (isMilestone || isRandomEvent) {
                let pool = EVENTS.filter(e => e.mode.includes(state.mode) && e.condition(state));
                if (pool.length === 0) pool = [EVENTS[0]];

                const totalW = pool.reduce((s, e) => s + e.weight, 0);
                let r = Math.random() * totalW;
                let ev = pool[0];
                for (let e of pool) {
                    r -= e.weight;
                    if (r <= 0) { ev = e; break; }
                }

                presentEventChoices(ev);
                isProcessing = false;
            } else {
                handleNormalYear();
                updateUI();
                checkSurvival();
                isProcessing = false;

                if (state.isAlive && !isWaitingForChoice) {
                    scheduleNextAutoPlay(850);
                }
            }
        }

        function handleNormalYear() {
            let pool = [];
            if (state.mode === 'normal') {
                pool = [
                    { text: '田畑を耕し、日々の糧を得た。平穏な一年だった。', money: 3 },
                    { text: '困窮する老人に握り飯を分け与えた。', virtue: 2, money: -1 },
                    { text: '古寺で兵法書を紐解き、戦術を学んだ。', strategy: 3, hp: -1 },
                    { text: '近隣の商人と交渉し、有利な商談を結んだ。', money: 12, strategy: 1 },
                    { text: '穏やかな年の暮れを迎えた。', money: 1 }
                ];
            } else if (state.mode === 'battle') {
                pool = [
                    { text: '砦の警備にあたり、幾度かの奇襲を退けた。', valor: 3 },
                    { text: '敵の斥候部隊を看破し、味方に急報をもたらした！', strategy: 4, virtue: 2 },
                    { text: '野営の夜、星を見上げながら故郷に想いを馳せた。', hp: 2 },
                    { text: '小競り合いの中で、打ち倒した敵兵の銭袋を拾った。', money: 6, karma: 2 }
                ];
            } else if (state.mode === 'fugitive') {
                pool = [
                    { text: '追手の篝火を避け、冷たい洞窟で一夜を明かした。', hp: -3 },
                    { text: '野イチゴや木の根を掘り、空腹を紛らわせた。', hp: 1 },
                    { text: '人里離れた山道をひたすら歩き続けた。', hp: -2 }
                ];
            }

            const item = pool[Math.floor(Math.random() * pool.length)];
            const hpDiff = item.hp || 0;
            const moneyDiff = item.money || 0;

            state.health += hpDiff;
            state.money += moneyDiff;
            if (item.valor) state.valor += item.valor;
            if (item.karma) state.karma += item.karma;
            if (item.strategy) state.strategy += item.strategy;
            if (item.virtue) state.virtue += item.virtue;

            if (state.health > 150) state.health = 150;

            let tag = [];
            if (hpDiff !== 0) tag.push(`体力${hpDiff > 0 ? '+' : ''}${hpDiff}`);
            if (moneyDiff !== 0) tag.push(`銭${moneyDiff > 0 ? '+' : ''}${moneyDiff}`);
            const statStr = tag.length > 0 ? `<span class="text-[10px] text-gray-500 ml-1">(${tag.join(', ')})</span>` : '';

            addLog(`<span class="font-bold text-gray-500">【${state.age}歳】</span> ${item.text}${statStr}`);
        }

        // ================= 状況説明テキストと選択肢の確実な表示 =================
        function presentEventChoices(ev) {
            stopAutoPlay();
            isWaitingForChoice = true;

            state.flags.currentEventTitle = ev.title;
            const textContent = typeof ev.text === 'function' ? ev.text(state) : ev.text;

            // 状況説明を「金枠のイベント強調カード」としてログに注入
            const card = document.createElement('div');
            card.className = 'event-active-card';
            card.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-black text-gold flex items-center">
                        <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full mr-1.5 animate-ping"></span>
                        【${state.age}歳】${ev.title}
                    </span>
                    <span class="text-[10px] text-yellow-200/60 font-bold border border-yellow-700/50 px-1 py-0.2 rounded">選択の刻</span>
                </div>
                <div class="text-[13px] leading-relaxed text-gray-100 font-bold">
                    ${textContent}
                </div>
            `;
            logContainer.appendChild(card);

            // 選択肢コンテナの構築
            choicesContainer.innerHTML = '';
            const validChoices = ev.choices.filter(c => !c.condition || c.condition(state));

            validChoices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "choice-btn w-full text-left py-2 px-3 rounded text-xs sm:text-sm text-gray-200 transition-all flex flex-col cursor-pointer";

                const hintHtml = choice.hint ? `<span class="text-[10px] text-gray-400 mt-0.5 ml-3">↳ ${choice.hint}</span>` : '';
                btn.innerHTML = `<span class="font-bold flex items-center leading-snug"><span class="text-gold text-xs mr-1 shrink-0">◆</span>${choice.text}</span>${hintHtml}`;

                btn.onclick = () => {
                    executeChoice(choice);
                };

                choicesContainer.appendChild(btn);
            });

            // UI切り替え
            advanceBtn.classList.add('hidden');
            choicesContainer.classList.remove('hidden');
            choicesContainer.classList.add('flex');

            // 状況説明カードが必ず視界に入るよう、確実に最下部へスクロール
            requestAnimationFrame(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                setTimeout(() => {
                    if (logContainer) logContainer.scrollTop = logContainer.scrollHeight;
                }, 50);
            });
        }

        function executeChoice(choice) {
            if (!state.isAlive) return;

            choicesContainer.classList.add('hidden');
            choicesContainer.classList.remove('flex');
            choicesContainer.innerHTML = '';

            const res = choice.effect(state);
            const hpChg = res.hp || 0;
            const moneyChg = res.money || 0;

            state.health += hpChg;
            state.money += moneyChg;
            if (state.health > 150) state.health = 150;

            if (state.money < 0) {
                state.money = 0;
                state.health -= 25;
                state.lastDamageEvent = '極度の困窮';
                state.deathCause = 'starvation';
            } else if (hpChg < 0) {
                state.lastDamageEvent = state.flags.currentEventTitle || '重傷';
                if (!state.deathCause) state.deathCause = state.mode === 'battle' ? 'battle' : 'oldage';
            }

            let tags = [];
            if (hpChg !== 0) tags.push(`体力${hpChg > 0 ? '+' : ''}${hpChg}`);
            if (moneyChg !== 0) tags.push(`銭${moneyChg > 0 ? '+' : ''}${moneyChg}`);
            const statTag = tags.length > 0 ? `<span class="text-[10px] text-gray-500 ml-1">(${tags.join(', ')})</span>` : '';

            addLog(`<span class="font-bold text-gray-500 mr-1">┗ 決断:</span><em class="text-gray-300">${choice.text.replace(/【.*?】/g, '')}</em><br>${res.log}${statTag}`, hpChg <= -25);

            if (hpChg < 0 && appContainer) {
                appContainer.classList.remove('damage-flash');
                void appContainer.offsetWidth;
                appContainer.classList.add('damage-flash');
            }

            updateUI();
            isWaitingForChoice = false;

            checkSurvival();

            if (state.isAlive) {
                advanceBtn.classList.remove('hidden');
                if (advanceBtnText) advanceBtnText.innerText = "次 の 年 へ 進 む";
                scheduleNextAutoPlay(1000);
            }
        }

        function updateUI() {
            if (!uiAge) return;
            uiAge.innerText = state.age;
            uiClass.innerText = state.classInfo ? state.classInfo.name : '--';
            uiHealth.innerText = Math.max(0, state.health);
            uiMoney.innerText = state.money;
            uiRice.innerText = state.rice;
            uiRicePrice.innerText = state.ricePrice;

            if (state.faction) {
                uiFaction.innerText = state.faction.name;
                uiFaction.style.backgroundColor = state.faction.color;
            }

            const hb = document.getElementById('health-box');
            if (hb) {
                if (state.health <= 30) {
                    hb.classList.add('bg-red-950', 'border-red-600');
                    hb.classList.remove('bg-[#201C18]', 'border-[#3A322A]');
                } else {
                    hb.classList.remove('bg-red-950', 'border-red-600');
                    hb.classList.add('bg-[#201C18]', 'border-[#3A322A]');
                }
            }

            if (appContainer) appContainer.classList.remove('mode-battle', 'mode-fugitive');
            if (modeBadge) {
                modeBadge.classList.add('hidden');
                if (state.mode === 'battle') {
                    if (appContainer) appContainer.classList.add('mode-battle');
                    modeBadge.innerText = '戦場';
                    modeBadge.className = 'text-[10px] bg-red-950 text-red-200 border border-red-600 px-1.5 py-0.5 font-bold rounded-sm';
                    modeBadge.classList.remove('hidden');
                } else if (state.mode === 'fugitive') {
                    if (appContainer) appContainer.classList.add('mode-fugitive');
                    modeBadge.innerText = '逃亡';
                    modeBadge.className = 'text-[10px] bg-gray-900 text-gray-300 border border-gray-600 px-1.5 py-0.5 font-bold rounded-sm';
                    modeBadge.classList.remove('hidden');
                }
            }

            if (!isWaitingForChoice && advanceBtnText) {
                advanceBtnText.innerText = autoPlayTimer ? "自動進行中... (タップで進む)" : "歳 月 を 進 め る";
            }
        }

        function addLog(html, isHeavy = false) {
            if (!logContainer) return;
            const div = document.createElement('div');
            div.className = `log-entry ${isHeavy ? 'font-bold text-blood' : ''}`;
            div.innerHTML = html;
            logContainer.appendChild(div);
            requestAnimationFrame(() => {
                if (logContainer) logContainer.scrollTop = logContainer.scrollHeight;
            });
        }

        function checkSurvival() {
            if (!state.isAlive) return;

            if (state.age >= 70) {
                state.health = 0;
                state.lastDamageEvent = '天寿';
                state.deathCause = 'oldage';
                addLog(`<span class="text-gold font-bold">天寿を全うし、静かに目を閉じた……。</span>`);
            } else if (state.age >= 60 && Math.random() < (state.age - 59) * 0.08) {
                state.health = 0;
                state.lastDamageEvent = '老衰';
                state.deathCause = 'oldage';
                addLog(`<span class="text-gray-400 font-bold">長き風雪に耐えた身体が静かに眠りについた。</span>`);
            }

            if (state.health <= 0) {
                state.isAlive = false;
                stopAutoPlay();
                isWaitingForChoice = false;
                isProcessing = false;

                let reason = "戦国の風雲に呑まれ、息絶えた。";
                if (state.deathCause === 'starvation') reason = "食うや食わずの果てに餓死を遂げた。";
                else if (state.deathCause === 'oldage') reason = "数多の死線を潜り抜け、畳の上で穏やかに生涯を閉じた。";
                else if (state.deathCause === 'execution') reason = "謀反の咎により、無惨にも斬首された。";
                else if (state.deathCause === 'hunted') reason = "落武者狩りに遭い、名もなき泥の中で息絶えた。";
                else reason = `${state.lastDamageEvent}により深い手傷を負い、命を落とした。`;

                const finalTitle = calculateTitle(state);
                const nextHeirloom = determineHeirloom(state);

                window.currentReincarnationCount = (window.currentReincarnationCount || 0) + 1;
                window.activeHeirloom = nextHeirloom;

                try {
                    localStorage.setItem('sengoku_rinne_count', window.currentReincarnationCount);
                    if (nextHeirloom) localStorage.setItem('sengoku_heirloom', JSON.stringify(nextHeirloom));
                    else localStorage.removeItem('sengoku_heirloom');

                    const past = JSON.parse(localStorage.getItem('sengoku_past_lives') || '[]');
                    past.unshift({
                        age: state.age,
                        className: state.classInfo ? state.classInfo.name : '不明',
                        faction: state.faction ? state.faction.name : '不明',
                        title: finalTitle,
                        reason: reason,
                        valor: state.valor, karma: state.karma, luck: state.luck, money: state.money,
                        strategy: state.strategy, virtue: state.virtue,
                        timestamp: Date.now()
                    });
                    localStorage.setItem('sengoku_past_lives', JSON.stringify(past.slice(0, 30)));
                } catch (e) {
                    console.warn("Save local failed:", e);
                }

                if (typeof window.__saveDeathData === 'function') {
                    window.__saveDeathData(state.age, state.classInfo ? state.classInfo.name : '', state.faction ? state.faction.name : '', finalTitle, reason, state, nextHeirloom);
                }

                if (state.age >= 60) {
                    setTimeout(() => showPremiumEnding(finalTitle, nextHeirloom), 400);
                } else {
                    setTimeout(() => showGameOver(reason, finalTitle, nextHeirloom, state.deathCause), 400);
                }
            }
        }

        function showGameOver(reason, title, nextHeirloom, deathCause) {
            const screen = document.getElementById('gameover-screen');
            const mainTitle = document.getElementById('go-main-title');
            const subTitle = document.getElementById('go-sub-title');

            // 背景と文字スタイルのリセット
            screen.className = 'hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-5 text-white text-center backdrop-blur-md overflow-y-auto pointer-events-auto transition-colors duration-700';
            mainTitle.className = 'text-5xl sm:text-6xl font-black mb-1 mt-2 tracking-[0.25em]';

            // 死因に応じた演出の適用
            if (deathCause === 'starvation') {
                screen.classList.add('death-bg-starvation');
                mainTitle.classList.add('death-text-starvation');
                mainTitle.innerText = '餓死';
                subTitle.innerText = '- 飢えに苛まれし末路 -';
            } else if (deathCause === 'execution') {
                screen.classList.add('death-bg-execution');
                mainTitle.classList.add('death-text-execution');
                mainTitle.innerText = '斬首';
                subTitle.innerText = '- 野望の果て、刑場の露と消ゆ -';
            } else if (deathCause === 'hunted') {
                screen.classList.add('death-bg-hunted');
                mainTitle.classList.add('death-text-hunted');
                mainTitle.innerText = '野垂死';
                subTitle.innerText = '- 泥に塗れ、名もなき骸となる -';
            } else {
                // デフォルト (討死など)
                screen.classList.add('death-bg-battle');
                mainTitle.classList.add('death-text-battle');
                mainTitle.innerText = '討死';
                subTitle.innerText = '- 乱世の泡と消ゆ -';
            }

            document.getElementById('go-age').innerText = state.age;
            document.getElementById('go-class').innerText = state.classInfo ? state.classInfo.name : '--';
            document.getElementById('go-faction').innerText = state.faction ? `[${state.faction.name}]` : '';
            document.getElementById('go-title').innerText = title;

            document.getElementById('go-valor').innerText = state.valor;
            document.getElementById('go-karma').innerText = state.karma;
            document.getElementById('go-luck').innerText = state.luck;
            document.getElementById('go-strategy').innerText = state.strategy;
            document.getElementById('go-virtue').innerText = state.virtue;
            document.getElementById('go-money').innerText = state.money;
            document.getElementById('go-reason').innerText = reason;

            const hlNotice = document.getElementById('new-heirloom-notice');
            if (nextHeirloom) {
                hlNotice.classList.remove('hidden');
                document.getElementById('new-heirloom-text').innerText = nextHeirloom.name;
            } else {
                hlNotice.classList.add('hidden');
            }

            if (gameScreen) gameScreen.classList.add('hidden');
            if (gameoverScreen) {
                gameoverScreen.classList.remove('hidden');
                gameoverScreen.style.pointerEvents = 'auto';
            }
            const rinneBtn = document.getElementById('rinne-btn');
            if (rinneBtn) {
                rinneBtn.disabled = false;
                rinneBtn.style.pointerEvents = 'auto';
            }
        }

        function showPremiumEnding(title, nextHeirloom) {
            if (gameScreen) gameScreen.classList.add('hidden');
            const screen = document.getElementById('premium-screen');
            const content = document.getElementById('premium-content');

            screen.classList.remove('hidden');
            screen.style.pointerEvents = 'auto';
            content.classList.remove('opacity-100');
            content.classList.add('opacity-0');

            document.getElementById('premium-title').innerText = `【称号: ${title}】`;
            document.getElementById('premium-age').innerText = state.age;
            document.getElementById('premium-class').innerText = state.classInfo ? state.classInfo.name : '--';
            document.getElementById('premium-faction').innerText = state.faction ? `[${state.faction.name}]` : '';

            document.getElementById('premium-valor').innerText = state.valor;
            document.getElementById('premium-karma').innerText = state.karma;
            document.getElementById('premium-luck').innerText = state.luck;
            document.getElementById('premium-strategy').innerText = state.strategy;
            document.getElementById('premium-virtue').innerText = state.virtue;
            document.getElementById('premium-money').innerText = state.money;

            const hlNotice = document.getElementById('premium-heirloom-notice');
            if (nextHeirloom) {
                hlNotice.classList.remove('hidden');
                document.getElementById('premium-heirloom-text').innerText = nextHeirloom.name;
            } else {
                hlNotice.classList.add('hidden');
            }

            const freeze = document.getElementById('freeze-overlay');
            if (freeze) freeze.classList.add('freeze-active');

            setTimeout(() => {
                if (freeze) freeze.classList.remove('freeze-active');
                if (content) {
                    content.classList.remove('opacity-0');
                    content.classList.add('opacity-100');
                    content.style.pointerEvents = 'auto';
                }
                const pBtn = document.getElementById('premium-rinne-btn');
                if (pBtn) {
                    pBtn.disabled = false;
                    pBtn.style.pointerEvents = 'auto';
                }
                startSakuraParticles();
            }, 3000);
        }

        function startSakuraParticles() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const particles = Array.from({ length: 70 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                size: Math.random() * 4 + 3,
                speedY: Math.random() * 2 + 1,
                speedX: Math.random() * 2 - 1,
                type: Math.random() > 0.5 ? 'gold' : 'sakura',
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 3,
                opacity: Math.random() * 0.7 + 0.3
            }));

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.globalAlpha = p.opacity;
                    if (p.type === 'gold') {
                        ctx.fillStyle = '#D4AF37';
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
                    } else {
                        ctx.fillStyle = '#FFB7C5';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(p.angle * 0.04) * 0.5;
                    p.angle += p.spin;
                    if (p.y > canvas.height + 20) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });
                animFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        window.resetGame = function(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            resetAllStateAndUI();
            window.updateStartScreenUI();
            if (startScreen) startScreen.classList.remove('hidden');
        };

        window.openHistory = async function(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            historyScreen.classList.remove('hidden');
            const hList = document.getElementById('history-list');
            const hLoading = document.getElementById('history-loading');
            hList.classList.add('hidden');
            hLoading.classList.remove('hidden');

            let records = [];
            if (typeof window.__fetchPastLives === 'function') {
                try { records = await window.__fetchPastLives(); } catch (e) {}
            }
            if (!records || records.length === 0) {
                try { records = JSON.parse(localStorage.getItem('sengoku_past_lives') || '[]'); } catch (e) {}
            }

            hLoading.classList.add('hidden');
            hList.classList.remove('hidden');
            hList.innerHTML = '';

            if (records.length === 0) {
                hList.innerHTML = '<div class="text-center text-gray-500 mt-10 text-xs">魂の記録はまだ刻まれておりません。</div>';
                return;
            }

            records.forEach(item => {
                const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString('ja-JP') : '';
                const card = document.createElement('div');
                card.className = 'bg-[#181513] border border-[#3A322A] p-3 rounded-sm relative shadow';
                const ojBadge = item.age >= 60 ? '<span class="absolute top-2 right-2 text-[10px] bg-yellow-800 text-yellow-100 px-1.5 py-0.5 rounded-sm border border-yellow-600 font-bold">大往生</span>' : '';

                card.innerHTML = `
                    ${ojBadge}
                    <div class="text-[10px] text-gray-500 mb-1">${dateStr}</div>
                    <div class="text-sm font-bold text-gold mb-1">${item.title || '名もなき武者'}</div>
                    <div class="flex items-baseline gap-3 text-xs text-gray-300 mb-2">
                        <span>享年 <strong class="text-lg text-blood">${item.age}</strong> 歳</span>
                        <span class="text-gray-400">[${item.faction || '浪人'}] ${item.className}</span>
                    </div>
                    <div class="text-xs text-gray-400 bg-black/60 p-2 rounded-sm border border-gray-800 leading-relaxed">
                        死因: ${item.reason}
                    </div>
                `;
                hList.appendChild(card);
            });
        };

        window.closeHistory = function(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            historyScreen.classList.add('hidden');
        };

        function bindButton(id, handler) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.onclick = handler;
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                handler(e);
            }, { passive: false });
        }

        function initApp() {
            cacheElements();
            window.updateStartScreenUI();

            bindButton('start-btn', window.startGame);
            bindButton('advance-btn', window.manualAdvance);
            bindButton('history-btn', window.openHistory);
            bindButton('close-history-btn', window.closeHistory);
            bindButton('rinne-btn', window.resetGame);
            bindButton('premium-rinne-btn', window.resetGame);

            bindButton('market-toggle-btn', toggleMarket);
            bindButton('buy-rice-btn', buyRiceAction);
            bindButton('sell-rice-btn', sellRiceAction);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    })();
    </script>

    <!-- ================= Firebase連携 (安全フォールバック) ================= -->
    <script type="module">
        (async function() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'sengoku-life-app';
                const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                let firebaseConfig = {};
                try { firebaseConfig = JSON.parse(firebaseConfigStr); } catch (e) {}

                if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) return;

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                const initToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                try {
                    if (initToken) await signInWithCustomToken(auth, initToken);
                    else await signInAnonymously(auth);
                } catch (authErr) {
                    console.warn("Auth initialization fallback:", authErr);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.__currentUser = user;
                        try {
                            const countRef = doc(db, 'artifacts', appId, 'users', user.uid, 'stats', 'reincarnation');
                            onSnapshot(countRef, (docSnap) => {
                                if (docSnap.exists()) {
                                    const data = docSnap.data();
                                    if (typeof data.count === 'number') {
                                        window.currentReincarnationCount = data.count;
                                        window.activeHeirloom = data.nextHeirloom || null;
                                        if (typeof window.updateStartScreenUI === 'function') {
                                            window.updateStartScreenUI();
                                        }
                                    }
                                }
                            }, (err) => console.warn("Snapshot error:", err));
                        } catch (snapErr) {
                            console.warn("Firestore snapshot attach failed:", snapErr);
                        }
                    }
                });

                window.__saveDeathData = async (age, className, factionName, title, reason, finalState, newHeirloom) => {
                    if (!window.__currentUser) return;
                    const uid = window.__currentUser.uid;
                    try {
                        const countRef = doc(db, 'artifacts', appId, 'users', uid, 'stats', 'reincarnation');
                        setDoc(countRef, { 
                            count: window.currentReincarnationCount,
                            nextHeirloom: newHeirloom
                        }, { merge: true }).catch(() => {});

                        const pastLivesRef = collection(db, 'artifacts', appId, 'users', uid, 'past_lives');
                        addDoc(pastLivesRef, {
                            age: age, className: className, faction: factionName, title: title, reason: reason, 
                            valor: finalState.valor, karma: finalState.karma, 
                            luck: finalState.luck, money: finalState.money,
                            strategy: finalState.strategy, virtue: finalState.virtue,
                            timestamp: Date.now()
                        }).catch(() => {});
                    } catch (e) {
                        console.warn("Firebase save skipped:", e);
                    }
                };

                window.__fetchPastLives = async () => {
                    if (!window.__currentUser) return [];
                    const pastLivesRef = collection(db, 'artifacts', appId, 'users', window.__currentUser.uid, 'past_lives');
                    try {
                        const snapshot = await getDocs(pastLivesRef);
                        let lives = [];
                        snapshot.forEach(d => lives.push({ id: d.id, ...d.data() }));
                        lives.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        return lives;
                    } catch (e) {
                        return [];
                    }
                };
            } catch (initErr) {
                console.warn("Firebase dynamic import skipped:", initErr);
            }
        })();
    </script>
